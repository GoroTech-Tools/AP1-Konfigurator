name: Build and release AP1-Konfigurator

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Create build virtual environment
        shell: pwsh
        run: python -m venv .venv

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r src\requirements.txt

      - name: Align build version with release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Ungültiger Release-Tag: $env:RELEASE_TAG"
          }
          $version = $Matches[1]
          $path = 'src\build_info.py'
          $content = Get-Content $path -Raw -Encoding UTF8
          $content = $content -replace "'version':\s*'\d+\.\d+\.\d+'", "'version': '$version'"
          $content = $content -replace "'build_date':\s*'[^']+'", "'build_date': '$((Get-Date).ToString('yyyy-MM-ddTHH:mm:ss'))'"
          Set-Content $path $content -Encoding UTF8
          Write-Host "Build-Version auf $version gesetzt."

      - name: Build and package application
        shell: pwsh
        run: .\src\build.ps1 -NoVersionBump

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: AP1-Konfigurator-${{ github.sha }}
          path: |
            dist/AP1-Konfigurator-v*/
            release/RELEASE_NOTES_v*.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload release ZIP
        uses: actions/upload-artifact@v7
        with:
          name: AP1-Konfigurator-release-${{ github.sha }}
          path: release/AP1-Konfigurator-v*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download release ZIP
        uses: actions/download-artifact@v8
        with:
          name: AP1-Konfigurator-release-${{ github.sha }}
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: AP1-Konfigurator ${{ github.ref_name }}
          files: |
            release/AP1-Konfigurator-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
